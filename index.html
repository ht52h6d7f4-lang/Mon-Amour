<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #ffe6eb, #ffffff);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    body.glow {
      animation: glowPulse 1.4s ease-out forwards;
    }

    @keyframes glowPulse {
      0% { box-shadow: inset 0 0 0 rgba(255,55,95,0); }
      40% { box-shadow: inset 0 0 120px rgba(255,55,95,0.35); }
      100% { box-shadow: inset 0 0 0 rgba(255,55,95,0); }
    }

    .card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      padding: 36px 32px;
      border-radius: 26px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      width: 90%;
      max-width: 360px;
    }

    h1 {
      font-size: 24px;
      color: #ff375f;
      margin-bottom: 8px;
    }

    p {
      font-size: 15px;
      color: #666;
      margin-bottom: 18px;
    }

    #counter {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 18px;
    }

    .buttons {
      position: relative;
      height: 180px;
    }

    button {
      width: 120px;
      padding: 14px 0;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      transition: left 0.35s ease, top 0.35s ease, transform 0.3s ease;
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff375f, #ff7a90);
      color: white;
      top: 80px;
      z-index: 2;
    }

    #noBtn {
      background: #e5e5ea;
      color: #555;
      z-index: 1;
    }

    iframe { display: none; }
  </style>
</head>
<body>

  <iframe
    id="ytplayer"
    src="https://www.youtube.com/embed/2Vv-BfVoq4g?enablejsapi=1&playsinline=1"
    allow="autoplay">
  </iframe>

  <div class="card">
    <h1 id="question"></h1>
    <p>There is only one correct answer.</p>
    <div id="counter">Attempts to say No: 0 😈</div>

    <div class="buttons" id="buttonArea">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    const name = prompt("Who is this for? 💕") || "You";
    document.getElementById("question").innerText =
      `${name}, will you be my Valentine?`;

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const area = document.getElementById("buttonArea");
    const counter = document.getElementById("counter");
    const player = document.getElementById("ytplayer");

    let attempts = 0;
    let yesScale = 1;
    const FIXED_DISTANCE = 100;

    const softHaptic = () => navigator.vibrate && navigator.vibrate(12);
    const strongHaptic = () => navigator.vibrate && navigator.vibrate([20,30,20,40]);

    function positionNoButton() {
      const yesRect = yesBtn.getBoundingClientRect();
      const areaRect = area.getBoundingClientRect();

      const cx = yesRect.left - areaRect.left + yesRect.width / 2;
      const cy = yesRect.top - areaRect.top + yesRect.height / 2;

      const angle = Math.random() * Math.PI * 2;
      const dynamicRadius = FIXED_DISTANCE + (yesRect.width - 120) / 2;

      noBtn.style.left =
        cx + Math.cos(angle) * dynamicRadius - noBtn.offsetWidth / 2 + "px";
      noBtn.style.top =
        cy + Math.sin(angle) * dynamicRadius - noBtn.offsetHeight / 2 + "px";
    }

    positionNoButton();

    noBtn.addEventListener("mouseover", () => {
      attempts++;
      counter.innerText = `Attempts to say No: ${attempts} 😈`;
      softHaptic();

      yesScale += 0.05;
      yesBtn.style.transform = `translateX(-50%) scale(${yesScale})`;

      positionNoButton();
    });

    /* 🎉 Celebration Effects */
    function heartConfetti() {
      confetti({
        particleCount: 80,
        spread: 90,
        startVelocity: 35,
        scalar: 1.3,
        shapes: ["heart"],
        colors: ["#ff375f", "#ff7a90", "#ffd1dc"],
        origin: { y: 0.65 }
      });
    }

    function balloonWave() {
      confetti({
        particleCount: 45,
        startVelocity: 18,
        gravity: 0.45,
        scalar: 1.4,
        shapes: ["circle"],
        colors: ["#ff375f", "#ffb3c6", "#ffd166", "#a0c4ff", "#cdb4db"],
        origin: { y: 1 }
      });
    }

    yesBtn.addEventListener("click", () => {
      strongHaptic();
      document.body.classList.add("glow");

      player.contentWindow.postMessage(
        '{"event":"command","func":"playVideo","args":""}',
        '*'
      );

      for (let i = 0; i < 10; i++) {
        setTimeout(heartConfetti, i * 160);
        setTimeout(balloonWave, i * 200);
      }

      setTimeout(() => {
        document.body.innerHTML = `
          <div style="
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(180deg,#ff375f,#ff8fa3);
            font-family:-apple-system,BlinkMacSystemFont,sans-serif;
            color:white;
            text-align:center;
            padding:24px;
          ">
            <h1 style="font-size:28px;font-weight:600;">
              💖 It’s a YES 💖<br>
              ${name}, you’re my Valentine 🥰
            </h1>
          </div>
        `;
      }, 1500);
    });
  </script>

</body>
</html>
