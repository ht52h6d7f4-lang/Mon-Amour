<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #ffe6eb, #ffffff);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 36px 32px;
      border-radius: 26px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      position: relative;
      width: 90%;
      max-width: 360px;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #ff375f;
      margin-bottom: 8px;
    }

    p {
      font-size: 15px;
      color: #666;
      margin-bottom: 26px;
    }

    #counter {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 18px;
    }

    .buttons {
      position: relative;
      height: 140px;
    }

    button {
      width: 120px;
      padding: 14px 0;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    #yesBtn {
      background: linear-gradient(135deg, #ff375f, #ff748c);
      color: white;
      box-shadow: 0 6px 14px rgba(255,55,95,0.4);
      top: 60px;
      z-index: 2;
    }

    #noBtn {
      background: #e5e5ea;
      color: #555;
      top: 0;
    }

    iframe {
      display: none;
    }
  </style>
</head>
<body>

  <!-- YouTube player for "Perfect" -->
  <iframe
    id="ytplayer"
    src="https://www.youtube.com/embed/2Vv-BfVoq4g?enablejsapi=1&playsinline=1"
    allow="autoplay"
  ></iframe>

  <div class="card">
    <h1 id="question"></h1>
    <p>There is only one correct answer.</p>
    <div id="counter">Attempts to say No: 0 😈</div>

    <div class="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    // Personalization
    const name = prompt("Who is this for? 💕") || "You";
    document.getElementById("question").innerText =
      `${name}, will you be my Valentine?`;

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const counterText = document.getElementById("counter");
    const player = document.getElementById("ytplayer");

    let attempts = 0;

    // iOS-style haptics
    function hapticSoft() {
      navigator.vibrate && navigator.vibrate(15);
    }

    function hapticStrong() {
      navigator.vibrate && navigator.vibrate([25, 40, 25, 40, 80]);
    }

    // Move NO button around YES (2–4 inches)
    function moveNoAroundYes() {
      const yesRect = yesBtn.getBoundingClientRect();

      const minRadius = 190; // ~2 inches
      const maxRadius = 380; // ~4 inches

      const angle = Math.random() * Math.PI * 2;
      const radius = minRadius + Math.random() * (maxRadius - minRadius);

      const x =
        yesRect.left +
        yesRect.width / 2 +
        radius * Math.cos(angle) -
        noBtn.offsetWidth / 2;

      const y =
        yesRect.top +
        yesRect.height / 2 +
        radius * Math.sin(angle) -
        noBtn.offsetHeight / 2;

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    // NO button teasing 😈
    noBtn.addEventListener("mouseover", () => {
      attempts++;
      counterText.innerText = `Attempts to say No: ${attempts} 😈`;
      hapticSoft();
      moveNoAroundYes();
    });

    // YES click 💖
    yesBtn.addEventListener("click", () => {
      hapticStrong();

      // Play "Perfect"
      player.contentWindow.postMessage(
        '{"event":"command","func":"playVideo","args":""}',
        '*'
      );

      // Confetti celebration
      const burst = () => {
        confetti({
          particleCount: 45,
          spread: 90,
          origin: { y: 0.65 },
          colors: ["#ff375f", "#ff7a90", "#ffd1dc"]
        });
      };

      for (let i = 0; i < 7; i++) {
        setTimeout(burst, i * 180);
      }

      setTimeout(() => {
        document.body.innerHTML = `
          <div style="
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(180deg,#ff375f,#ff8fa3);
            font-family:-apple-system,BlinkMacSystemFont,sans-serif;
            color:white;
            text-align:center;
            padding:24px;
          ">
            <h1 style="font-size:28px;font-weight:600;">
              💖 It’s a YES 💖<br><br>
              ${name}, you’re my Valentine 🥰<br><br>
              🎵 Perfect feels even more perfect 🎵
            </h1>
          </div>
        `;
      }, 1200);
    });
  </script>

</body>
</html>
