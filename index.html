<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>

  <!-- Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      position: relative;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 10px;
    }

    #counter {
      font-size: 14px;
      color: #999;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin: 10px;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
    }

    #noBtn {
      background-color: #adb5bd;
      color: white;
      position: absolute;
    }

    /* Hide YouTube iframe */
    iframe {
      display: none;
    }
  </style>
</head>
<body>

  <!-- YouTube embed for "Perfect" -->
  <iframe
    id="ytplayer"
    src="https://www.youtube.com/embed/2Vv-BfVoq4g?enablejsapi=1"
    allow="autoplay"
  ></iframe>

  <div class="card">
    <h1 id="question"></h1>
    <div id="counter">Attempts to say No: 0 😈</div>
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 💔</button>
  </div>

  <script>
    // Name prompt
    const name = prompt("Who is this for? 💕") || "You";
    document.getElementById("question").innerText =
      `Will you be my Valentine, ${name}? 💘`;

    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const counterText = document.getElementById("counter");
    const player = document.getElementById("ytplayer");

    let attempts = 0;

    // iOS-style haptics (soft tap)
    function hapticTap() {
      if (navigator.vibrate) {
        navigator.vibrate(20);
      }
    }

    // Celebration haptics
    function hapticCelebrate() {
      if (navigator.vibrate) {
        navigator.vibrate([30, 40, 30, 40, 60]);
      }
    }

    // NO button trolling
    noBtn.addEventListener("mouseover", () => {
      attempts++;
      counterText.innerText = `Attempts to say No: ${attempts} 😈`;
      hapticTap();

      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    });

    yesBtn.addEventListener("click", () => {
      hapticCelebrate();

      // Start "Perfect" 🎵
      player.contentWindow.postMessage(
        '{"event":"command","func":"playVideo","args":""}',
        '*'
      );

      // Heart confetti 💕
      const burst = () => {
        confetti({
          particleCount: 40,
          spread: 90,
          origin: { y: 0.6 },
          colors: ["#ff4d6d", "#ff758f", "#ffb3c6"]
        });
      };

      for (let i = 0; i < 6; i++) {
        setTimeout(burst, i * 200);
      }

      setTimeout(() => {
        document.body.innerHTML = `
          <div style="
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg,#ff4d6d,#ffb3c6);
            font-family:'Comic Sans MS',cursive;
            color:white;
            text-align:center;
            padding:20px;
          ">
            <h1>
              💖 IT'S A YES 💖<br><br>
              ${name}, you’re my Valentine 🥰<br><br>
              🎵 Perfect just got more perfect 🎵
            </h1>
          </div>
        `;
      }, 1200);
    });
  </script>

</body>
</html>
